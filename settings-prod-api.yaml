version: 6
networks:
  base:
    rpcs:
      # The River prod API only: local x402 proxy to QuickNode (paid onchain),
      # public endpoints kept as fallbacks. Browsers never use this file.
      - http://127.0.0.1:8545/base-mainnet
      - https://mainnet.base.org
      - https://base.drpc.org
      - https://base-rpc.publicnode.com
      - https://developer-access-mainnet.base.org
    chain-id: 8453
    network-id: 8453
    currency: ETH
  ethereum:
    rpcs:
      - https://ethereum-rpc.publicnode.com
      - https://eth.drpc.org
    chain-id: 1
    network-id: 1
    currency: ETH
  hyperevm:
    rpcs:
      - https://rpc.hyperliquid.xyz/evm
    chain-id: 999
    network-id: 999
    currency: HYPE
  robinhood:
    rpcs:
      - https://rpc.mainnet.chain.robinhood.com
      - https://robinhood-rpc.publicnode.com
    chain-id: 4663
    network-id: 4663
    currency: ETH
subgraphs:
  base: https://subgraph.api.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/raindex-base/0xe522cB4a5fCb2eb31a52Ff41a4653d85A4fd7C9D-8e9477b/gn
  sft-base: https://api.subgraph.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/sft-base/prod/gn
  sft-ethereum: https://api.subgraph.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/sft-mainnet/prod/gn
  sft-hyperevm: https://api.subgraph.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/sft-hyperevm/prod/gn
  sft-robinhood: https://api.subgraph.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/sft-robinhood/prod/gn
  # Raindex on Robinhood Chain, indexed by Ormi as raindex-robinhood/prod.
  robinhood: https://api.subgraph.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/raindex-robinhood/prod/gn
metaboards:
  base: https://subgraph.api.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/metadata-base/2025-07-06-594f/gn
  robinhood: https://subgraph.api.ormilabs.com/api/public/9f4fc2fa-4a15-44f7-a7c1-66fdaa518a71/subgraphs/metadata-robinhood/prod/gn
raindexes:
  base:
    address: 0xe522cB4a5fCb2eb31a52Ff41a4653d85A4fd7C9D
    network: base
    subgraph: base
    deployment-block: 41747644
    local-db-remote: raindex
  robinhood:
    # The canonical RaindexV6 used on every chain except Base, which is still
    # on the older 0xe522cB4a. Verified on 4663 with eth_getCode; the deploy
    # block is bisected from the same, 2026-09-10.
    address: 0x37FC0EFec37D19f8A221aa4F8F7600C9ba2AcD20
    network: robinhood
    deployment-block: 59557818
    subgraph: robinhood
    local-db-remote: raindex
rainlangs:
  base:
    address: 0x22508460712C350e914b49155982d3A92D923b10
    network: base
  robinhood:
    address: 0x2DdEa6131E0e46536c6b658D5ACFf922E6133be5
    network: robinhood
local-db-remotes:
  # Our own bootstrap snapshot (exported hourly from the prod API DB; tools/raindex-snapshot).
  raindex: https://theriver.markets/raindex-db/latest/manifest.yaml
local-db-sync:
  base:
    batch-size: 50
    max-concurrent-batches: 1
    retry-attempts: 3
    retry-delay-ms: 1000
    rate-limit-delay-ms: 5000
    finality-depth: 4
    bootstrap-block-threshold: 300
    # 4 Oct cost review: getLogs on the paid RPC dominate credits; 15 s still keeps order
    # and trade lists fresh (quotes are live eth_calls either way).
    sync-interval-ms: 15000
  robinhood:
    batch-size: 1250
    max-concurrent-batches: 1
    retry-attempts: 3
    retry-delay-ms: 1000
    rate-limit-delay-ms: 5000
    finality-depth: 100
    bootstrap-block-threshold: 6000
    sync-interval-ms: 5000
using-tokens-from:
